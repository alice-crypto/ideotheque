<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relais — vos colis, à vélo, dans l'heure</title>
  <meta name="description" content="Exemple Idéothèque : landing page d'un service de livraison à vélo fictif, en couleurs primaires.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/fx.css">
  <link rel="stylesheet" href="exemples.css">
  <link rel="stylesheet" href="primaire.css">
  <style>
    :root { --fx-accent: var(--y); --fx-accent-2: var(--r); }
    .rh { background: var(--b); color: var(--w); border-color: var(--k); }
    .rh .pnav a:hover { border-color: var(--y); }
    .rh .plogo i::after { background: var(--w); }
    .rhero { border-bottom: var(--rule); overflow: hidden; }
    .rhero-g { display: grid; grid-template-columns: 6fr 6fr; gap: 24px; align-items: center; min-height: calc(92vh - 68px); padding-block: 40px; }
    .rhero h1 { font-size: clamp(54px, 8.6vw, 136px); line-height: .9; letter-spacing: -.05em; font-stretch: 120%; }
    .rhero h1 em { font-style: normal; color: var(--y); }
    .rmap { background: var(--w); border: var(--rule); color: var(--k); box-shadow: 12px 12px 0 var(--r); }
    .rmap svg { display: block; width: 100%; height: auto; }
    .rmap .streets path { stroke: var(--k); stroke-width: 1; fill: none; stroke-dasharray: none; }
    /*@css*/
  </style>
</head>
<body>
  <header class="phead rh">
    <div class="wrap">
      <a class="plogo" href="#top"><i><b></b></i> Relais</a>
      <nav class="pnav" aria-label="Menu">
        <a href="#suivi">Suivi</a>
        <a href="#carte">Zones</a>
        <a href="#impact">Impact</a>
        <a href="#tarifs">Tarifs</a>
      </nav>
      <a class="pbtn yel" href="dashboard-relais.html" data-fx-tr="corner-sweep">Espace pro</a>
    </div>
  </header>
  <main id="top">
    <section class="rhero on-b">
      <div class="wrap rhero-g">
        <div>
          <span class="tag" style="color:var(--y)">Livraison urbaine à vélo</span>
          <h1 style="margin-top:16px"><span data-fx="curtain-words">Livré avant</span> <em data-fx="glow-on" style="--fx-glow:var(--y);text-shadow:none">midi.</em></h1>
          <p style="margin-top:20px;font-size:clamp(18px,1.8vw,23px);font-weight:500;max-width:32ch">Vos colis traversent la ville à vélo, dans l'heure, sans bruit et sans camion.</p>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:24px">
            <a class="pbtn yel" href="#tarifs" data-fx="magnetic">Envoyer un colis</a>
            <a class="pbtn ghost" href="#suivi">Voir le suivi</a>
          </div>
        </div>
        <!--@hero-->
      </div>
    </section>
    <!--@sec-->
  </main>
  <!--@html-->
  <a class="ex-back" href="index.html" data-fx-tr="corner-sweep">← Tous les exemples</a>
  <script src="../dist/fx.js" defer></script>
  <script>
    /*@js*/
  </script>
</body>
</html>
