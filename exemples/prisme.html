<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisme — vos chiffres, enfin clairs</title>
  <meta name="description" content="Exemple Idéothèque : landing page d'un outil d'analyse fictif, en couleurs primaires.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dist/fx.css">
  <link rel="stylesheet" href="exemples.css">
  <link rel="stylesheet" href="primaire.css">
  <style>
    .hero { border-bottom: var(--rule); overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 28px; align-items: end; padding-block: clamp(36px, 6vw, 80px); }
    .hero h1 { font-size: clamp(50px, 9.4vw, 148px); line-height: .9; letter-spacing: -.045em; font-stretch: 118%; }
    .hero h1 em { font-style: normal; color: var(--r); }
    .hero .lead { margin-top: 26px; font-size: clamp(18px, 1.7vw, 22px); line-height: 1.35; max-width: 34ch; font-weight: 500; }
    .hero .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .comp { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; aspect-ratio: 1; border: var(--rule); }
    .comp > * { border-right: var(--rule); border-bottom: var(--rule); min-width: 0; position: relative; overflow: hidden; }
    .comp .fill { position: absolute; inset: 0; }
    /*@css*/
  </style>
</head>
<body>
  <header class="phead">
    <div class="wrap">
      <a class="plogo" href="#top"><i><b></b></i> Prisme</a>
      <nav class="pnav" aria-label="Menu">
        <a href="#fonctions">Fonctions</a>
        <a href="#methode">Méthode</a>
        <a href="#tarifs">Tarifs</a>
        <a href="#questions">Questions</a>
      </nav>
      <a class="pbtn" href="dashboard-prisme.html" data-fx-tr="diagonal-tiles">Voir la démo</a>
    </div>
  </header>
  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <span class="tag">Analyse pour petites équipes</span>
          <h1 data-fx="curtain-words" style="margin-top:18px">Vos chiffres, enfin clairs.</h1>
          <p class="lead" data-fx="blur-words">Prisme rassemble vos ventes, vos clients et votre trésorerie sur une seule page. Sans tableur, et sans jargon.</p>
          <div class="acts">
            <a class="pbtn" href="#tarifs" data-fx="magnetic">Essayer 30 jours</a>
            <a class="pbtn ghost" href="dashboard-prisme.html" data-fx-tr="diagonal-tiles">Voir la démo</a>
          </div>
        </div>
        <!--@hero-->
      </div>
    </section>
    <!--@sec-->
  </main>
  <!--@html-->
  <a class="ex-back" href="index.html" data-fx-tr="diagonal-tiles">← Tous les exemples</a>
  <script src="../dist/fx.js" defer></script>
  <script>
    /*@js*/
  </script>
</body>
</html>
